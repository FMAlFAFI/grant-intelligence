# Grant Intelligence in a container.
#
#   docker compose up --build        dashboard at http://localhost:8501
#
# The dashboard shows the outputs that are already in ./data and ./results next to this file, so with
# the pre-generated outputs in place it is populated as soon as it starts. Without them the pages say
# which outputs are missing; `docker compose --profile pipeline run --rm pipeline` produces them (it
# generates the synthetic corpus, downloads the two pinned models, about 1.5 GB, and runs the 14 steps).
#
# Settings come from .env, which has to exist next to this file: `cp .env.example .env` (the submission
# archive already contains it). The plain env_file form below works with Docker Compose v2 and with the
# legacy docker-compose v1.

x-app: &app
  build:
    context: .
    dockerfile: Dockerfile
  image: grant-intelligence:latest
  env_file:
    - .env
  environment:
    # Container path of the pseudonym mapping: in its own volume, outside the application folder
    PSEUDONYM_MAP_PATH: /home/app/grant-intelligence-private/pseudonym_map.csv
  volumes:
    # Pre-generated outputs and caches from the host folder, so nothing has to be computed first
    - ./data:/app/data
    - ./results:/app/results
    - ./cache:/app/cache
    # Kept by Docker: logs, downloaded models, and the pseudonym mapping (never inside the repository)
    - logs:/app/logs
    - model-cache:/home/app/.cache/huggingface
    - private:/home/app/grant-intelligence-private

services:
  dashboard:
    <<: *app
    ports:
      - "8501:8501"
    restart: unless-stopped

  pipeline:
    <<: *app
    profiles: ["pipeline"]
    command: ["python", "-m", "app.pipeline.analysis_pipeline"]

volumes:
  logs:
  model-cache:
  private:
